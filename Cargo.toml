[package]
name = "hairpin_havoc"
version = "1.9.1"
edition = "2024"
description = "A top-down pixel-art arcade racer for Omarchy, built with Bevy."
license = "MIT"
authors = ["Juan Casanueva"]
repository = "https://github.com/juancasanueva/omarchy-hairpin-havoc"

[[bin]]
name = "hairpin-havoc"
path = "src/main.rs"

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["2d", "ui", "audio"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[features]
# Faster incremental dev builds: `cargo run --features dev`
dev = ["bevy/dynamic_linking"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
